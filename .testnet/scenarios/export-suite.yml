defaults:
  network:
    node_count: 5
    launcher: tmux
    find_ports: true
    slave_delay: 0.2
    features:
      - ConsensusEntropy
      - Export
    track_features:
      - ConsensusEntropy
      - Export
    unl_report: true
    log_levels:
      TxQ: info
      Protocol: debug
      Peer: debug
      LedgerConsensus: debug
      ConsensusExtensions: debug
      NetworkOPs: info
    env:
      XAHAU_RESOURCE_PER_PORT: "1"
    rc:
      - rng_poll_ms=333

tests:
  # --- CE + Export (80% quorum, SHAMap convergence) ---
  - name: steady_state_export_ce
    script: .testnet/scenarios/export/steady_state_export.py

  - name: retriable_export_ce
    script: .testnet/scenarios/export/retriable_export.py

  - name: export_degradation_ce
    script: .testnet/scenarios/export/export_degradation.py
    network:
      rc:
        - rng_poll_ms=333
        - n3:no_export_sig=true
        - n4:no_export_sig=true

  # Resilience counterpart to export_degradation: all nodes DO sign, but the
  # scenario drops one validator's proposals to n0 after setup. n0 remains above
  # quorum from direct proposals, but must reconstruct the missing sidecar leaf
  # through the fetch/acquisition path.
  - name: export_sidecar_fetch_under_proposal_drop_ce
    script: .testnet/scenarios/export/export_fetch_under_proposal_drop.py
    network:
      rc:
        - rng_poll_ms=333

  - name: export_without_unl_report
    script: .testnet/scenarios/export/export_without_unl_report.py
    network:
      features:
        - Export
      track_features:
        - Export
      unl_report: false

  - name: export_no_veto_missing_observation
    script: .testnet/scenarios/export/export_no_veto_missing_observation.py
    network:
      rc:
        - rng_poll_ms=333
        - n4:no_export_sig_hash=true

  # CE + Export: 1 node suppressed, 4/5 = 80% quorum, should succeed
  - name: export_ce_one_node_down
    script: .testnet/scenarios/export/export_quorum.py
    params:
      expect_success: true
    network:
      rc:
        - rng_poll_ms=333
        - n4:no_export_sig=true

  # --- Export only, no CE (80% active-view quorum) ---
  - name: export_only_all_up
    script: .testnet/scenarios/export/export_quorum.py
    params:
      expect_success: true
    network:
      features:
        - Export
      track_features:
        - Export

  - name: export_only_one_node_down
    script: .testnet/scenarios/export/export_quorum.py
    params:
      expect_success: true
    network:
      features:
        - Export
      track_features:
        - Export
      rc:
        - rng_poll_ms=333
        - n4:no_export_sig=true

  - name: export_only_two_nodes_down
    script: .testnet/scenarios/export/export_quorum.py
    params:
      expect_success: false
    network:
      features:
        - Export
      track_features:
        - Export
      rc:
        - rng_poll_ms=333
        - n3:no_export_sig=true
        - n4:no_export_sig=true
