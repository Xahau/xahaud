name: clang-format

on: [push, pull_request]

jobs:
  check:
    if: (github.event_name == 'push' && github.event.pull_request == null) || github.event_name == 'pull_request'
    runs-on: ubuntu-20.04
    env:
      CLANG_VERSION: 10
    steps:
    - uses: actions/checkout@v3
    - name: Install clang-format
      uses: ./.github/actions/install-clang-format-ubuntu
      with:
        clang-version: ${{ env.CLANG_VERSION }}

    - name: Format src/ripple
      run: find src/ripple -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.ipp' \) -print0 | xargs -0 clang-format-${CLANG_VERSION} -i
    - name: Format src/test
      run: find src/test -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.ipp' \) -print0 | xargs -0 clang-format-${CLANG_VERSION} -i
    - name: Check for differences
      id: assert
      run: |
        set -o pipefail
        git diff --exit-code | tee "clang-format.patch"
    - name: Upload patch
      if: failure() && steps.assert.outcome == 'failure'
      uses: actions/upload-artifact@v4
      continue-on-error: true
      with:
        name: clang-format.patch
        if-no-files-found: ignore
        path: clang-format.patch
    - name: What happened?
      if: failure() && steps.assert.outcome == 'failure'
      env:
        PREAMBLE: |
          If you are reading this, you are looking at a failed Github Actions
          job.  That means you pushed one or more files that did not conform
          to the formatting specified in .clang-format. That may be because
          you neglected to run 'git clang-format' or 'clang-format' before
          committing, or that your version of clang-format has an
          incompatibility with the one on this
          machine, which is:
        SUGGESTION: |

          To fix it, you can do one of two things:
          1. Download and apply the patch generated as an artifact of this
             job to your repo, commit, and push.
          2. Run 'git-clang-format --extensions c,cpp,h,cxx,ipp dev'
             in your repo, commit, and push.
      run: |
        echo "${PREAMBLE}"
        clang-format-${CLANG_VERSION} --version
        echo "${SUGGESTION}"
        exit 1
