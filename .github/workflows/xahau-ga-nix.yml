name: Nix - GA Runner

on:
  push:
    branches: ["dev", "candidate", "release"]
  pull_request:
    branches: ["**"]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    - cron: '0 0 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix-setup:
    if: >
      github.event_name != 'pull_request' ||
      contains(fromJson('["dev","candidate","release"]'), github.base_ref) ||
      contains(join(github.event.pull_request.labels.*.name, ','), 'ci-full-build')
    runs-on: [self-hosted, generic, 20.04]
    container: python:3-slim
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Generate build matrix
        id: set-matrix
        shell: python
        run: |
          import json
          import os

          matrix = [
              {
                  "compiler_id": "gcc-13-libstdcxx",
                  "compiler": "gcc",
                  "cc": "gcc-13",
                  "cxx": "g++-13",
                  "compiler_version": 13,
                  "stdlib": "default",
                  "configuration": "Debug",
                  "job_type": "build"
              },
              {
                  # Latest stable Clang for the most accurate source-based
                  # coverage mapping (newer language features, fewer bugs in
                  # llvm-cov region inference). Pulled from apt.llvm.org since
                  # Ubuntu 24.04 default repos cap at clang-18.
                  "compiler_id": "clang-20-libcxx",
                  "compiler": "clang",
                  "cc": "clang-20",
                  "cxx": "clang++-20",
                  "compiler_version": 20,
                  "stdlib": "libcxx",
                  "configuration": "Debug",
                  "job_type": "coverage",
                  "coverage_tool": "llvm",
                  "coverage_format": "lcov",
                  # grpc 1.50.1 uses `Foo::template Bar(...)` without an
                  # angle-bracket arg list; clang-19+ promoted that to
                  # -Werror. Drop when grpc is bumped past the fix.
                  "conan_deps_cxxflags": {
                      "grpc/*": ["-Wno-missing-template-arg-list-after-template-kw"]
                  }
              },
              {
                  "compiler_id": "clang-16-libstdcxx-gcc13",
                  "compiler": "clang",
                  "cc": "clang-16",
                  "cxx": "clang++-16",
                  "compiler_version": 16,
                  "stdlib": "libstdcxx",
                  "clang_gcc_toolchain": 13,
                  "configuration": "Debug",
                  "job_type": "build"
              }
          ]

          # Add runs_on based on job_type
          for entry in matrix:
              if entry.get("job_type") == "coverage":
                  entry["runs_on"] = '["self-hosted", "generic", 24.04]'
              else:
                  entry["runs_on"] = '["self-hosted", "generic", 20.04]'

          # Output the matrix as JSON
          output = json.dumps({"include": matrix})
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"matrix={output}\n")

  build:
    needs: matrix-setup
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    permissions:
      id-token: write
      contents: read
    container:
      image: ubuntu:24.04
      volumes:
        - /home/runner/.conan-cache:/.conan-cache
        - /home/runner/.ccache-cache:/github/home/.ccache-cache
    defaults:
      run:
        shell: bash
    outputs:
      artifact_name: ${{ steps.set-artifact-name.outputs.artifact_name }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix-setup.outputs.matrix) }}
    env:
      build_dir: .build
      # Bump this number to invalidate all caches globally.
      CACHE_VERSION: 3
      MAIN_BRANCH_NAME: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          # Bump apt's default 3 retries; papers over short upstream blips
          # like the recurring ppa.launchpadcontent.net outages.
          echo 'Acquire::Retries "5";' > /etc/apt/apt.conf.d/80-retries
          apt-get update
          apt-get install -y software-properties-common
          add-apt-repository ppa:ubuntu-toolchain-r/test -y

          # apt.llvm.org for Clang versions newer than what Ubuntu 24.04 ships
          # (24.04 default repos cap at clang-18). The bootstrap script adds
          # the LLVM apt source for the requested version and runs apt-get update.
          if [ "${{ matrix.compiler }}" = "clang" ] && [ "${{ matrix.compiler_version }}" -ge 19 ]; then
            apt-get install -y wget gnupg lsb-release
            wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
            chmod +x /tmp/llvm.sh
            # `all` installs clang + libllvm + lldb + lld + the llvm-N package
            # (which provides llvm-profdata-N / llvm-cov-N for coverage runs).
            /tmp/llvm.sh ${{ matrix.compiler_version }} all
          fi

          apt-get update
          apt-get install -y git python3 python-is-python3 pipx
          pipx ensurepath
          apt-get install -y cmake ninja-build ${{ matrix.cc }} ${{ matrix.cxx }} ccache
          apt-get install -y perl # for openssl build
          apt-get install -y libsqlite3-dev # for xahaud build

          # Install the specific GCC version needed for Clang
          if [ -n "${{ matrix.clang_gcc_toolchain }}" ]; then
            echo "=== Installing GCC ${{ matrix.clang_gcc_toolchain }} for Clang ==="
            apt-get install -y gcc-${{ matrix.clang_gcc_toolchain }} g++-${{ matrix.clang_gcc_toolchain }} libstdc++-${{ matrix.clang_gcc_toolchain }}-dev

            echo "=== GCC versions available after installation ==="
            ls -la /usr/lib/gcc/x86_64-linux-gnu/ | grep -E "^d"
          fi

          # For Clang < 16 with --gcc-toolchain, hide newer GCC versions
          # This is needed because --gcc-toolchain still picks the highest version
          #
          # THE GREAT GCC HIDING TRICK (for Clang < 16):
          # Clang versions before 16 don't have --gcc-install-dir, only --gcc-toolchain
          # which is deprecated and still uses discovery heuristics that ALWAYS pick
          # the highest version number. So we play a sneaky game...
          #
          # We rename newer GCC versions to very low integers (1, 2, 3...) which makes
          # Clang think they're ancient GCC versions. Since 11 > 3 > 2 > 1, Clang will
          # pick GCC 11 over our renamed versions. It's dumb but it works!
          #
          # Example: GCC 12→1, GCC 13→2, GCC 14→3, so Clang picks 11 (highest number)
          if [ -n "${{ matrix.clang_gcc_toolchain }}" ] && [ "${{ matrix.compiler_version }}" -lt "16" ]; then
            echo "=== Hiding GCC versions newer than ${{ matrix.clang_gcc_toolchain }} for Clang < 16 ==="
            target_version=${{ matrix.clang_gcc_toolchain }}
            counter=1  # Start with 1 - these will be seen as "GCC version 1, 2, 3" etc
            for dir in /usr/lib/gcc/x86_64-linux-gnu/*/; do
              if [ -d "$dir" ]; then
                version=$(basename "$dir")
                # Check if version is numeric and greater than target
                if [[ "$version" =~ ^[0-9]+$ ]] && [ "$version" -gt "$target_version" ]; then
                  echo "Hiding GCC $version -> renaming to $counter (will be seen as GCC version $counter)"
                  # Safety check: ensure target doesn't already exist
                  if [ ! -e "/usr/lib/gcc/x86_64-linux-gnu/$counter" ]; then
                    mv "$dir" "/usr/lib/gcc/x86_64-linux-gnu/$counter"
                  else
                    echo "ERROR: Cannot rename GCC $version - /usr/lib/gcc/x86_64-linux-gnu/$counter already exists"
                    exit 1
                  fi
                  counter=$((counter + 1))
                fi
              fi
            done
          fi

          # Verify what Clang will use
          if [ -n "${{ matrix.clang_gcc_toolchain }}" ]; then
            echo "=== Verifying GCC toolchain selection ==="
            echo "Available GCC versions:"
            ls -la /usr/lib/gcc/x86_64-linux-gnu/ | grep -E "^d.*[0-9]+$" || true

            echo ""
            echo "Clang's detected GCC installation:"
            ${{ matrix.cxx }} -v -E -x c++ /dev/null -o /dev/null 2>&1 | grep "Found candidate GCC installation" || true
          fi

          # Install libc++ dev packages if using libc++ (not needed for libstdc++)
          if [ "${{ matrix.stdlib }}" = "libcxx" ]; then
            apt-get install -y libc++-${{ matrix.compiler_version }}-dev libc++abi-${{ matrix.compiler_version }}-dev
          fi

          # Install Conan 2
          pipx install "conan>=2.0,<3"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

          # Install coverage tooling
          if [ "${{ matrix.job_type }}" = "coverage" ]; then
            apt-get install -y curl lcov
            if [ "${{ matrix.coverage_tool }}" = "llvm" ]; then
              # Native LLVM source-based coverage: llvm-profdata + llvm-cov.
              # The clang-N package doesn't pull these in; the llvm-N package does.
              apt-get install -y "llvm-${{ matrix.compiler_version }}"
            else
              pipx install "gcovr>=7,<9"
            fi
          fi

      - name: Check environment
        run: |
          echo "PATH:"
          echo "${PATH}" | tr ':' '\n'
          which conan && conan --version || echo "Conan not found"
          which cmake && cmake --version || echo "CMake not found"
          which ${{ matrix.cc }} && ${{ matrix.cc }} --version || echo "${{ matrix.cc }} not found"
          which ${{ matrix.cxx }} && ${{ matrix.cxx }} --version || echo "${{ matrix.cxx }} not found"
          which ccache && ccache --version || echo "ccache not found"

          # Check coverage tooling
          if [ "${{ matrix.job_type }}" = "coverage" ]; then
            if [ "${{ matrix.coverage_tool }}" = "llvm" ]; then
              which "llvm-profdata-${{ matrix.compiler_version }}" && "llvm-profdata-${{ matrix.compiler_version }}" --version || echo "llvm-profdata not found"
              which "llvm-cov-${{ matrix.compiler_version }}" && "llvm-cov-${{ matrix.compiler_version }}" --version || echo "llvm-cov not found"
            else
              which gcov && gcov --version || echo "gcov not found"
              which gcovr && gcovr --version || echo "gcovr not found"
            fi
          fi

          echo "---- Full Environment ----"
          env

      - name: Get commit message
        id: get-commit-message
        uses: ./.github/actions/xahau-ga-get-commit-message
        with:
          event-name: ${{ github.event_name }}
          head-commit-message: ${{ github.event.head_commit.message }}
          pr-head-sha: ${{ github.event.pull_request.head.sha }}

      - name: Install dependencies
        uses: ./.github/actions/xahau-ga-dependencies
        with:
          configuration: ${{ matrix.configuration }}
          build_dir: ${{ env.build_dir }}
          compiler-id: ${{ matrix.compiler_id }}
          cache_version: ${{ env.CACHE_VERSION }}
          main_branch: ${{ env.MAIN_BRANCH_NAME }}
          compiler: ${{ matrix.compiler }}
          compiler_version: ${{ matrix.compiler_version }}
          cc: ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}
          stdlib: ${{ matrix.stdlib }}
          conan_deps_cxxflags: ${{ matrix.conan_deps_cxxflags && toJson(matrix.conan_deps_cxxflags) || '{}' }}
          gha_cache_enabled: 'false' # Disable caching for self hosted runner

      - name: Build
        if: matrix.job_type == 'build'
        uses: ./.github/actions/xahau-ga-build
        with:
          generator: Ninja
          configuration: ${{ matrix.configuration }}
          build_dir: ${{ env.build_dir }}
          cc: ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}
          compiler-id: ${{ matrix.compiler_id }}
          cache_version: ${{ env.CACHE_VERSION }}
          main_branch: ${{ env.MAIN_BRANCH_NAME }}
          stdlib: ${{ matrix.stdlib }}
          clang_gcc_toolchain: ${{ matrix.clang_gcc_toolchain || '' }}
          ccache_max_size: '100G'

      # [TEST PR] Host sampler: every 20s record load, PSI, steal time, cgroup
      # CPU throttling and the number of rippled processes for the whole
      # coverage build+test run, so a multi_runner stall report can be
      # correlated with host state. Detached; printed by the step after Build.
      - name: Start host sampler (coverage)
        if: matrix.job_type == 'coverage'
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/sampler.sh" <<'EOF'
          #!/bin/bash
          out="$1"
          prev_total=0; prev_steal=0; prev_up=""
          while true; do
            read -r _ u n s i w q sq st _ < /proc/stat
            total=$((u+n+s+i+w+q+sq+st))
            dt=$((total-prev_total)); ds=$((st-prev_steal))
            steal_pct=0
            [ "$prev_total" -gt 0 ] && [ "$dt" -gt 0 ] && steal_pct=$((100*ds/dt))
            # Fraction of guest CPU time actually accounted over the interval:
            # jiffies delta / (wall delta * ncpu * HZ). Well below 100% with
            # steal%=0 means the vCPUs were not running (hypervisor), which the
            # guest cannot see as steal on this VM.
            now_up=$(cut -d' ' -f1 /proc/uptime)
            delivered="n/a"
            if [ -n "$prev_up" ]; then
              delivered=$(awk -v dj="$dt" -v du="$(awk -v a="$now_up" -v b="$prev_up" 'BEGIN{print a-b}')" -v n="$(nproc)" 'BEGIN{ if (du>0) printf "%d%%", 100*dj/(du*n*100); else print "n/a"}')
            fi
            prev_up=$now_up
            prev_total=$total; prev_steal=$st
            nr=0; nl=0
            for c in /proc/[0-9]*/comm; do
              read -r name < "$c" 2>/dev/null || continue
              [ "$name" = rippled ] && nr=$((nr+1))
              case "$name" in llvm*) nl=$((nl+1));; esac
            done
            # block I/O: sectors written and ms spent doing I/O, summed over whole disks
            disk=$(awk '$3 ~ /^(sd[a-z]+|vd[a-z]+|nvme[0-9]+n[0-9]+)$/ {w+=$10; t+=$13} END{printf "wr_sectors=%d io_ms=%d", w, t}' /proc/diskstats)
            vm=$(awk '/^(pgpgout|nr_dirty|nr_writeback|pgfault|thp_fault_alloc) /{printf "%s=%s ", $1, $2}' /proc/vmstat)
            thr=$(grep -E '^(nr_throttled|throttled_usec)' /sys/fs/cgroup/cpu.stat 2>/dev/null | tr '\n' ' ')
            # the multi_runner parent: the rippled whose cmdline has --unittest but not --unittest-child
            pp=""
            for d in /proc/[0-9]*; do
              read -r name < "$d/comm" 2>/dev/null && [ "$name" = rippled ] || continue
              cl=$(tr '\0' ' ' < "$d/cmdline" 2>/dev/null) || continue
              case "$cl" in
                *--unittest-child*) ;;
                *--unittest*) pp=${d#/proc/}; break ;;
              esac
            done
            parent=""
            if [ -n "$pp" ] && [ -r "/proc/$pp/schedstat" ]; then
              # schedstat: on-cpu ns, runqueue-wait ns, timeslices; thread states (R/S/D counts)
              parent="parent_pid=$pp schedstat=[$(cat /proc/$pp/schedstat)] threads=[$(awk '{print $3}' /proc/$pp/task/*/stat 2>/dev/null | sort | uniq -c | tr -s ' \n' ' ')] ctxsw=[$(awk '/ctxt_switches/{printf "%s ", $2}' /proc/$pp/status)]"
            fi
            percpu=$(awk '/^cpu[0-9]/{printf "%d,", $2+$3+$4+$5+$6+$7+$8+$9}' /proc/stat)
            echo "$(date -u +%FT%TZ) up=$(cut -d' ' -f1 /proc/uptime) load=$(cut -d' ' -f1-3 /proc/loadavg) steal%=$steal_pct steal_total=$st cpu_delivered=$delivered jiffies=$total psi_cpu=$(awk '/^some/{print $2}' /proc/pressure/cpu 2>/dev/null) psi_mem=$(awk '/^full/{print $2}' /proc/pressure/memory 2>/dev/null) psi_io=$(awk '/^some/{print $2}' /proc/pressure/io 2>/dev/null) memavail_mb=$(awk '/MemAvailable/{print int($2/1024)}' /proc/meminfo) rippled_procs=$nr llvm_procs=$nl $disk $vm$thr$parent percpu_jiffies=$percpu" >> "$out"
            sleep 5
          done
          EOF
          chmod +x "$RUNNER_TEMP/sampler.sh"
          echo "nproc=$(nproc) cpu.max=$(cat /sys/fs/cgroup/cpu.max 2>/dev/null || echo n/a) cpuset=$(cat /sys/fs/cgroup/cpuset.cpus.effective 2>/dev/null || echo n/a)"
          echo "kernel=$(uname -r) clocksource=$(cat /sys/devices/system/clocksource/clocksource0/current_clocksource 2>/dev/null) hypervisor_flag=$(grep -c -w hypervisor /proc/cpuinfo) dmi=$(cat /sys/class/dmi/id/sys_vendor /sys/class/dmi/id/product_name 2>/dev/null | tr '\n' ' ') dmesg_restrict=$(cat /proc/sys/kernel/dmesg_restrict 2>/dev/null)"
          grep -E '^(model name|cpu MHz)' /proc/cpuinfo | sort | uniq -c | head -4
          setsid nohup "$RUNNER_TEMP/sampler.sh" "$RUNNER_TEMP/host-samples.log" > /dev/null 2>&1 &
          echo "sampler pid $!"
          # Probes (see .github/scripts/ci-probe/*.c): hypervisor features once, then a
          # 10ms sleeper (timer wake-up latency, the parent heartbeat's situation) and
          # two spinners pinned to CPUs 3 and 17 (vCPU not running vs in-guest preemption),
          # two cpuid loops pinned to CPUs 5 and 11 (is a vCPU stuck returning from a VM
          # exit?) and a fresh-page toucher pinned to CPU 9 (is it the page-fault path?).
          ${{ matrix.cc }} -O2 -o "$RUNNER_TEMP/hv_info" .github/scripts/ci-probe/hv_info.c && "$RUNNER_TEMP/hv_info" || echo "hv_info unavailable"
          cat /sys/class/dmi/id/bios_vendor /sys/class/dmi/id/bios_version /sys/class/dmi/id/product_version 2>/dev/null | tr '\n' ' '; echo
          if ${{ matrix.cc }} -O2 -o "$RUNNER_TEMP/stall_probe" .github/scripts/ci-probe/stall_probe.c; then
            setsid nohup "$RUNNER_TEMP/stall_probe" sleep 10 100 > "$RUNNER_TEMP/probe-sleep.log" 2>&1 &
            setsid nohup "$RUNNER_TEMP/stall_probe" spin 3 100 > "$RUNNER_TEMP/probe-spin3.log" 2>&1 &
            setsid nohup "$RUNNER_TEMP/stall_probe" spin 17 100 > "$RUNNER_TEMP/probe-spin17.log" 2>&1 &
            setsid nohup "$RUNNER_TEMP/stall_probe" exit 5 100 > "$RUNNER_TEMP/probe-exit5.log" 2>&1 &
            setsid nohup "$RUNNER_TEMP/stall_probe" exit 11 100 > "$RUNNER_TEMP/probe-exit11.log" 2>&1 &
            setsid nohup "$RUNNER_TEMP/stall_probe" fault 9 100 > "$RUNNER_TEMP/probe-fault9.log" 2>&1 &
            echo "probes started"
          else
            echo "stall_probe build failed; continuing without probes"
          fi
          # Host paging probe: 512 MB re-touched after 120 s idle, and 64 MB after 10 s (control).
          if ${{ matrix.cc }} -O2 -o "$RUNNER_TEMP/memtouch" .github/scripts/ci-probe/memtouch.c; then
            setsid nohup "$RUNNER_TEMP/memtouch" 512 120 > "$RUNNER_TEMP/probe-mem512.log" 2>&1 &
            setsid nohup "$RUNNER_TEMP/memtouch" 64 10 > "$RUNNER_TEMP/probe-mem64.log" 2>&1 &
          fi
          if ${{ matrix.cc }} -O2 -o "$RUNNER_TEMP/memfresh" .github/scripts/ci-probe/memfresh.c; then
            setsid nohup "$RUNNER_TEMP/memfresh" 512 90 > "$RUNNER_TEMP/probe-memfresh.log" 2>&1 &
          fi
          echo "clockevent=$(cat /sys/devices/system/clockevents/clockevent0/current_device 2>/dev/null) available_clocksource=$(cat /sys/devices/system/clocksource/clocksource0/available_clocksource 2>/dev/null) thp=$(cat /sys/kernel/mm/transparent_hugepage/enabled 2>/dev/null) virtio_drivers=$(ls /sys/bus/virtio/drivers 2>/dev/null | tr '\n' ',')"
          # Is idle time in /proc/stat wall-clock based (NO_HZ idle) or tick based? Decides
          # whether lost per-vCPU jiffies on an idle guest mean "halted vCPU not woken" or
          # "vCPU frozen while running". Plus the TSC flags behind the missing tsc clocksource.
          echo "cmdline=$(cat /proc/cmdline) nohz_full=$(cat /sys/devices/system/cpu/nohz_full 2>/dev/null) $(grep -E '^CONFIG_(NO_HZ|HZ=|VIRT_CPU_ACCOUNTING|TICK_CPU_ACCOUNTING|IRQ_TIME_ACCOUNTING)' /boot/config-$(uname -r) 2>/dev/null | tr '\n' ' ') tsc_flags=$(grep -m1 '^flags' /proc/cpuinfo | grep -o -w -E 'constant_tsc|nonstop_tsc|tsc_known_freq|tsc_reliable|rdtscp|tsc_adjust|hypervisor' | tr '\n' ',')"
          grep -m2 -E "nohz_mode|hres_active|Clock Event Device" /proc/timer_list 2>/dev/null || echo "timer_list not readable"
          # Are the guest's free pages handed back to the host (balloon / free page reporting)?
          # If so every fresh page costs a host-side allocation, which is where the fault probe stalls.
          for d in /sys/bus/virtio/drivers/virtio_balloon/virtio*; do echo "balloon $(basename $d) features=$(cat $d/features 2>/dev/null)"; done
          grep -E "^(balloon_|thp_fault_alloc|thp_collapse_alloc|compact_stall|compact_fail|pgmigrate_success)" /proc/vmstat | tr '\n' ' '; echo

      - name: Build (Coverage)
        if: matrix.job_type == 'coverage'
        uses: ./.github/actions/xahau-ga-build
        with:
          generator: Ninja
          configuration: ${{ matrix.configuration }}
          build_dir: ${{ env.build_dir }}
          cc: ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}
          gcov: ${{ matrix.gcov }}
          compiler-id: ${{ matrix.compiler_id }}
          cache_version: ${{ env.CACHE_VERSION }}
          main_branch: ${{ env.MAIN_BRANCH_NAME }}
          stdlib: ${{ matrix.stdlib }}
          # Coverage builds are slower due to instrumentation; use fewer parallel jobs to avoid flakiness.
          # Use *_FLAGS_DEBUG so the build action's stdlib flag (e.g. -stdlib=libc++) in CMAKE_CXX_FLAGS isn't clobbered.
          cmake-args: '-Dcoverage=ON -Dcoverage_tool=${{ matrix.coverage_tool }} -Dcoverage_format=${{ matrix.coverage_format }} -Dcoverage_test_parallelism=$(($(nproc)/2)) -DCODE_COVERAGE_VERBOSE=ON -DCMAKE_CXX_FLAGS_DEBUG="-g -O0" -DCMAKE_C_FLAGS_DEBUG="-g -O0"'
          cmake-target: 'coverage'
          ccache_max_size: '100G'

      # [TEST PR] Keep the slot for 12 more minutes with nothing but the sampler and
      # probes running, to see whether the stalls also happen on an idle guest.
      - name: Idle stall observation (coverage)
        if: always() && matrix.job_type == 'coverage'
        shell: bash
        run: |
          # 3 min quiet baseline, then a controlled 2 GB fdatasync write every 3 min
          # (does a guest write burst coincide with vCPU stalls?), 12 min in total.
          log="$RUNNER_TEMP/iotest.log"
          sleep 180
          for i in 1 2 3; do
            s=$(date -u +%FT%T.%3NZ); t0=$SECONDS
            dd if=/dev/zero of="$RUNNER_TEMP/iotest.bin" bs=1M count=2048 conv=fdatasync 2>/dev/null
            echo "$s dd 2GB fdatasync start, took $((SECONDS-t0))s, ended $(date -u +%FT%T.%3NZ)" >> "$log"
            rm -f "$RUNNER_TEMP/iotest.bin"
            sleep 180
          done

      # [TEST PR] see "Start host sampler" above.
      - name: Show host samples (coverage)
        if: always() && matrix.job_type == 'coverage'
        shell: bash
        run: |
          pkill -f sampler.sh || true
          pkill -x stall_probe || true
          for f in sleep spin3 spin17 exit5 exit11 fault9; do
            echo "---- probe-$f: $(grep -c ' gap=' "$RUNNER_TEMP/probe-$f.log" 2>/dev/null || true) gaps >100ms; gaps >=500ms or without a context switch:"
            { grep -E ' gap=' "$RUNNER_TEMP/probe-$f.log" 2>/dev/null || true; } | awk '{g=$3; sub("gap=","",g); sub("ms","",g); if (g+0>=500 || $6=="nivcsw+=0") print}' | head -60 || true
            { grep ' alive ' "$RUNNER_TEMP/probe-$f.log" 2>/dev/null || true; } | tail -1 || true
          done
          pkill -x memtouch || true
          pkill -x memfresh || true
          echo "---- controlled writes:"; cat "$RUNNER_TEMP/iotest.log" 2>/dev/null || true
          for f in mem512 mem64 memfresh; do
            echo "---- probe-$f (all lines):"
            cat "$RUNNER_TEMP/probe-$f.log" 2>/dev/null || true
          done
          echo "---- host samples"
          cat "$RUNNER_TEMP/host-samples.log" || echo "no samples recorded"
          echo "---- kernel messages (if readable) mentioning timers/clock/lockups/kvm, last 40"
          dmesg 2>&1 | grep -iE "hrtimer|clocksource|rcu|lockup|stall|kvm|hung task|steal" | tail -40 || true

      - name: Set artifact name
        if: matrix.job_type == 'build'
        id: set-artifact-name
        run: |
          ARTIFACT_NAME="build-output-nix-${{ github.run_id }}-${{ matrix.compiler }}-${{ matrix.configuration }}"
          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
          echo "Using artifact name: ${ARTIFACT_NAME}"

      - name: Debug build directory
        run: |
          echo "Checking build directory contents: ${{ env.build_dir }}"
          ls -la ${{ env.build_dir }} || echo "Build directory not found or empty"

      - name: Run tests
        if: matrix.job_type == 'build'
        run: |
          # Ensure the binary exists before trying to run
          if [ -f "${{ env.build_dir }}/rippled" ]; then
            ${{ env.build_dir }}/rippled --unittest --unittest-jobs $(nproc)
          else
             echo "Error: rippled executable not found in ${{ env.build_dir }}"
             exit 1
          fi

      # Coverage-specific steps
      - name: Move coverage report
        if: matrix.job_type == 'coverage'
        shell: bash
        env:
          COVERAGE_FILE: ${{ matrix.coverage_tool == 'llvm' && 'coverage.lcov' || 'coverage.xml' }}
        run: |
          mv "${{ env.build_dir }}/${COVERAGE_FILE}" ./
          echo "COVERAGE_FILE=${COVERAGE_FILE}" >> "$GITHUB_ENV"

      - name: Archive coverage report
        if: matrix.job_type == 'coverage'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.COVERAGE_FILE }}-${{ matrix.compiler_id }}
          path: ${{ env.COVERAGE_FILE }}
          retention-days: 30

      - name: Upload coverage report
        if: matrix.job_type == 'coverage' && github.repository == 'Xahau/xahaud'
        uses: codecov/codecov-action@v5
        with:
          files: ${{ env.COVERAGE_FILE }}
          flags: ${{ matrix.coverage_tool }}
          fail_ci_if_error: true
          disable_search: true
          verbose: true
          plugins: noop
          use_oidc: true

      - name: Export server definitions
        if: matrix.job_type == 'build' && matrix.compiler_id == 'gcc-13-libstdcxx'
        run: |
          ${{ env.build_dir }}/rippled --definitions | python3 -m json.tool > server_definitions.json

      - name: Upload server definitions
        if: matrix.job_type == 'build' && matrix.compiler_id == 'gcc-13-libstdcxx'
        uses: actions/upload-artifact@v7
        with:
          name: server-definitions
          path: server_definitions.json
          archive: false
