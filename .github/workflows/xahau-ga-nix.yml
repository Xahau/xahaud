name: Nix - GA Runner

on:
  push:
    branches: ["dev", "candidate", "release"]
  pull_request:
    branches: ["dev", "candidate", "release"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-job:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.set-artifact-name.outputs.artifact_name }}
    strategy:
      fail-fast: false
      matrix:
        # Matrix configuration:
        # - compiler_id: Full identifier with stdlib (e.g. clang-14-libstdcxx) for cache keys
        # - compiler: Base compiler family (gcc/clang) for Conan settings
        # - cc/cxx: Actual compiler executables
        # - compiler_version: Version number for Conan
        # - stdlib: Standard library (libstdcxx/libcxx) for Conan/CMake configuration
        compiler_id: [clang-14-libstdcxx-gcc11, clang-14-libstdcxx-gcc13, clang-16-libstdcxx-gcc13]  # Temporarily disabled: gcc-13-libstdcxx
        configuration: [Debug]
        include:
          # - compiler_id: gcc-13-libstdcxx
          #   compiler: gcc
          #   cc: gcc-13
          #   cxx: g++-13
          #   compiler_version: 13
          #   stdlib: libstdcxx
          - compiler_id: clang-14-libstdcxx-gcc11
            compiler: clang
            cc: clang-14
            cxx: clang++-14
            compiler_version: 14
            stdlib: libstdcxx  # Required for clang-14 compatibility
            clang_gcc_toolchain: 11  # Use GCC 11 headers with Clang 14
          - compiler_id: clang-14-libstdcxx-gcc13
            compiler: clang
            cc: clang-14
            cxx: clang++-14
            compiler_version: 14
            stdlib: libstdcxx  # Required for clang-14 compatibility
            clang_gcc_toolchain: 13  # Use GCC 13 headers with Clang 14 (GCC 14 too new)
          - compiler_id: clang-16-libstdcxx-gcc13
            compiler: clang
            cc: clang-16
            cxx: clang++-16
            compiler_version: 16
            stdlib: libstdcxx  # Workaround for missing lexicographical_compare_three_way in libc++
            clang_gcc_toolchain: 13  # Use GCC 13 headers with Clang 16
    env:
      build_dir: .build
      # Bump this number to invalidate all caches globally.
      CACHE_VERSION: 2
      MAIN_BRANCH_NAME: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          # If using Clang with specific GCC toolchain that's NOT 14, remove GCC 14 first
          if [ -n "${{ matrix.clang_gcc_toolchain }}" ] && [ "${{ matrix.clang_gcc_toolchain }}" != "14" ]; then
            echo "=== Removing GCC 14 to use GCC ${{ matrix.clang_gcc_toolchain }} ==="
            # Remove ALL GCC 14 related packages including headers
            sudo apt-get remove -y gcc-14 g++-14 cpp-14 libgcc-14-dev libstdc++-14-dev gcc-14-base || true
            
            # Hold packages to prevent them from being installed as dependencies
            sudo apt-mark hold gcc-14 g++-14 cpp-14 libgcc-14-dev libstdc++-14-dev gcc-14-base || true
          fi
          
          # Now update and install required packages
          sudo apt-get update
          sudo apt-get install -y ninja-build ${{ matrix.cc }} ${{ matrix.cxx }} ccache
          
          # Install specific GCC toolchain for Clang if specified (but not 14 which is already there)
          if [ -n "${{ matrix.clang_gcc_toolchain }}" ] && [ "${{ matrix.clang_gcc_toolchain }}" != "14" ]; then
            echo "=== Installing GCC ${{ matrix.clang_gcc_toolchain }} toolchain for Clang ==="
            sudo apt-get install -y gcc-${{ matrix.clang_gcc_toolchain }} g++-${{ matrix.clang_gcc_toolchain }}
          fi
          
          # Verify what Clang will use
          if [ -n "${{ matrix.clang_gcc_toolchain }}" ]; then
            echo "=== Verifying GCC configuration ==="
            gcc --version
            which gcc
            ls -la /usr/bin/gcc*
            ls -la /usr/bin/g++*
            
            echo "=== Available C++ include directories ==="
            ls -la /usr/include/c++/ || true
            
            echo "=== Checking what headers Clang will use ==="
            ${{ matrix.cxx }} -E -x c++ - -v < /dev/null 2>&1 | grep "^ /"
          fi
          
          # Install libc++ dev packages if using libc++ (not needed for libstdc++)
          if [ "${{ matrix.stdlib }}" = "libcxx" ]; then
            sudo apt-get install -y libc++-${{ matrix.compiler_version }}-dev libc++abi-${{ matrix.compiler_version }}-dev
          fi
          
          # Install specific Conan version needed
          pip install --upgrade "conan<2"

      - name: Configure ccache
        uses: ./.github/actions/xahau-configure-ccache
        with:
          max_size: 2G
          hash_dir: true
          compiler_check: content

      - name: Configure Conan
        run: |
          conan profile new default --detect || true # Ignore error if profile exists
          conan profile update settings.compiler.cppstd=20 default
          conan profile update settings.compiler=${{ matrix.compiler }} default
          # Set the C++ standard library based on matrix configuration
          if [ "${{ matrix.stdlib }}" = "libstdcxx" ]; then
            conan profile update settings.compiler.libcxx=libstdc++11 default
          elif [ "${{ matrix.stdlib }}" = "libcxx" ]; then
            conan profile update settings.compiler.libcxx=libc++ default
          fi
          conan profile update env.CC=/usr/bin/${{ matrix.cc }} default
          conan profile update env.CXX=/usr/bin/${{ matrix.cxx }} default
          conan profile update conf.tools.build:compiler_executables='{"c": "/usr/bin/${{ matrix.cc }}", "cpp": "/usr/bin/${{ matrix.cxx }}"}' default

          # Set compiler version from matrix
          conan profile update settings.compiler.version=${{ matrix.compiler_version }} default
          # Display profile for verification
          conan profile show default

      - name: Check environment
        run: |
          echo "PATH:"
          echo "${PATH}" | tr ':' '\n'
          which conan && conan --version || echo "Conan not found"
          which cmake && cmake --version || echo "CMake not found"
          which ${{ matrix.cc }} && ${{ matrix.cc }} --version || echo "${{ matrix.cc }} not found"
          which ${{ matrix.cxx }} && ${{ matrix.cxx }} --version || echo "${{ matrix.cxx }} not found"
          which ccache && ccache --version || echo "ccache not found"
          echo "---- Full Environment ----"
          env

      - name: Install dependencies
        uses: ./.github/actions/xahau-ga-dependencies
        with:
          configuration: ${{ matrix.configuration }}
          build_dir: ${{ env.build_dir }}
          compiler-id: ${{ matrix.compiler_id }}
          cache_version: ${{ env.CACHE_VERSION }}
          main_branch: ${{ env.MAIN_BRANCH_NAME }}
          stdlib: ${{ matrix.stdlib }}

      - name: Build
        uses: ./.github/actions/xahau-ga-build
        with:
          generator: Ninja
          configuration: ${{ matrix.configuration }}
          build_dir: ${{ env.build_dir }}
          cc: ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}
          compiler-id: ${{ matrix.compiler_id }}
          cache_version: ${{ env.CACHE_VERSION }}
          main_branch: ${{ env.MAIN_BRANCH_NAME }}
          stdlib: ${{ matrix.stdlib }}
          clang_gcc_toolchain: ${{ matrix.clang_gcc_toolchain || '' }}

      - name: Set artifact name
        id: set-artifact-name
        run: |
          ARTIFACT_NAME="build-output-nix-${{ github.run_id }}-${{ matrix.compiler }}-${{ matrix.configuration }}"
          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
          echo "Using artifact name: ${ARTIFACT_NAME}"

      - name: Debug build directory
        run: |
          echo "Checking build directory contents: ${{ env.build_dir }}"
          ls -la ${{ env.build_dir }} || echo "Build directory not found or empty"

      - name: Run tests
        run: |
          # Ensure the binary exists before trying to run
          if [ -f "${{ env.build_dir }}/rippled" ]; then
            ${{ env.build_dir }}/rippled --unittest --unittest-jobs $(nproc)
          else
             echo "Error: rippled executable not found in ${{ env.build_dir }}"
             exit 1
          fi
