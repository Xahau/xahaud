name: Nix - GA Runner

on:
  push:
    branches: ["dev", "candidate", "release"]
  pull_request:
    branches: ["**"]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    - cron: '0 0 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix-setup:
    if: >
      github.event_name != 'pull_request' ||
      contains(fromJson('["dev","candidate","release"]'), github.base_ref) ||
      contains(join(github.event.pull_request.labels.*.name, ','), 'ci-full-build')
    runs-on: [self-hosted, generic, 20.04]
    container: python:3-slim
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Generate build matrix
        id: set-matrix
        shell: python
        run: |
          import json
          import os

          matrix = [
              {
                  "compiler_id": "gcc-13-libstdcxx",
                  "compiler": "gcc",
                  "cc": "gcc-13",
                  "cxx": "g++-13",
                  "compiler_version": 13,
                  "stdlib": "default",
                  "configuration": "Debug",
                  "job_type": "build"
              },
              {
                  # Latest stable Clang for the most accurate source-based
                  # coverage mapping (newer language features, fewer bugs in
                  # llvm-cov region inference).
                  "compiler_id": "clang-20-libcxx",
                  "compiler": "clang",
                  "cc": "clang-20",
                  "cxx": "clang++-20",
                  "compiler_version": 20,
                  "stdlib": "libcxx",
                  "configuration": "Debug",
                  "job_type": "coverage",
                  "coverage_tool": "llvm",
                  "coverage_format": "lcov",
                  # grpc 1.50.1 uses `Foo::template Bar(...)` without an
                  # angle-bracket arg list; clang-19+ promoted that to
                  # -Werror. Drop when grpc is bumped past the fix.
                  "conan_deps_cxxflags": {
                      "grpc/*": ["-Wno-missing-template-arg-list-after-template-kw"]
                  }
              },
              {
                  # clang on gcc 13's libstdc++ (flake.nix wires the gcc).
                  # Oldest clang still in nixpkgs.
                  "compiler_id": "clang-18-libstdcxx-gcc13",
                  "compiler": "clang",
                  "cc": "clang-18",
                  "cxx": "clang++-18",
                  "compiler_version": 18,
                  "stdlib": "libstdcxx",
                  "configuration": "Debug",
                  "job_type": "build"
              }
          ]

          # Add runs_on based on job_type
          for entry in matrix:
              if entry.get("job_type") == "coverage":
                  entry["runs_on"] = '["self-hosted", "generic", 24.04]'
              else:
                  entry["runs_on"] = '["self-hosted", "generic", 20.04]'

          # Output the matrix as JSON
          output = json.dumps({"include": matrix})
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"matrix={output}\n")

  build:
    needs: matrix-setup
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    permissions:
      id-token: write
      contents: read
    container:
      image: ubuntu:24.04
      volumes:
        - /home/runner/.conan-cache:/.conan-cache
        - /home/runner/.ccache-cache:/github/home/.ccache-cache
    defaults:
      run:
        shell: bash
    outputs:
      artifact_name: ${{ steps.set-artifact-name.outputs.artifact_name }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix-setup.outputs.matrix) }}
    env:
      build_dir: .build
      # Bump this number to invalidate all caches globally.
      CACHE_VERSION: 3
      MAIN_BRANCH_NAME: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Toolchain and tools come from flake.nix (keyed by compiler_id);
      # Conan still builds the library dependencies.
      - name: Setup Nix environment
        uses: ./.github/actions/xahau-ga-setup-nix
        with:
          env: ${{ matrix.compiler_id }}

      - name: Check environment
        run: |
          echo "PATH:"
          echo "${PATH}" | tr ':' '\n'
          which conan && conan --version || echo "Conan not found"
          which cmake && cmake --version || echo "CMake not found"
          which ${{ matrix.cc }} && ${{ matrix.cc }} --version || echo "${{ matrix.cc }} not found"
          which ${{ matrix.cxx }} && ${{ matrix.cxx }} --version || echo "${{ matrix.cxx }} not found"
          which ccache && ccache --version || echo "ccache not found"

          # Check coverage tooling
          if [ "${{ matrix.job_type }}" = "coverage" ]; then
            if [ "${{ matrix.coverage_tool }}" = "llvm" ]; then
              which llvm-profdata && llvm-profdata --version || echo "llvm-profdata not found"
              which llvm-cov && llvm-cov --version || echo "llvm-cov not found"
            else
              which gcov && gcov --version || echo "gcov not found"
              which gcovr && gcovr --version || echo "gcovr not found"
            fi
          fi

          echo "---- Full Environment ----"
          env

      - name: Get commit message
        id: get-commit-message
        uses: ./.github/actions/xahau-ga-get-commit-message
        with:
          event-name: ${{ github.event_name }}
          head-commit-message: ${{ github.event.head_commit.message }}
          pr-head-sha: ${{ github.event.pull_request.head.sha }}

      - name: Install dependencies
        uses: ./.github/actions/xahau-ga-dependencies
        with:
          configuration: ${{ matrix.configuration }}
          build_dir: ${{ env.build_dir }}
          compiler-id: ${{ matrix.compiler_id }}
          cache_version: ${{ env.CACHE_VERSION }}
          main_branch: ${{ env.MAIN_BRANCH_NAME }}
          compiler: ${{ matrix.compiler }}
          compiler_version: ${{ matrix.compiler_version }}
          cc: ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}
          stdlib: ${{ matrix.stdlib }}
          conan_deps_cxxflags: ${{ matrix.conan_deps_cxxflags && toJson(matrix.conan_deps_cxxflags) || '{}' }}

      - name: Build
        if: matrix.job_type == 'build'
        uses: ./.github/actions/xahau-ga-build
        with:
          generator: Ninja
          configuration: ${{ matrix.configuration }}
          build_dir: ${{ env.build_dir }}
          cc: ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}
          compiler-id: ${{ matrix.compiler_id }}
          cache_version: ${{ env.CACHE_VERSION }}
          main_branch: ${{ env.MAIN_BRANCH_NAME }}
          stdlib: ${{ matrix.stdlib }}
          ccache_max_size: '100G'

      - name: Build (Coverage)
        if: matrix.job_type == 'coverage'
        uses: ./.github/actions/xahau-ga-build
        with:
          generator: Ninja
          configuration: ${{ matrix.configuration }}
          build_dir: ${{ env.build_dir }}
          cc: ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}
          compiler-id: ${{ matrix.compiler_id }}
          cache_version: ${{ env.CACHE_VERSION }}
          main_branch: ${{ env.MAIN_BRANCH_NAME }}
          stdlib: ${{ matrix.stdlib }}
          # Coverage builds are slower due to instrumentation; use fewer parallel jobs to avoid flakiness.
          # Use *_FLAGS_DEBUG so the build action's stdlib flag (e.g. -stdlib=libc++) in CMAKE_CXX_FLAGS isn't clobbered.
          cmake-args: '-Dcoverage=ON -Dcoverage_tool=${{ matrix.coverage_tool }} -Dcoverage_format=${{ matrix.coverage_format }} -Dcoverage_test_parallelism=$(($(nproc)/2)) -DCODE_COVERAGE_VERBOSE=ON -DCMAKE_CXX_FLAGS_DEBUG="-g -O0" -DCMAKE_C_FLAGS_DEBUG="-g -O0"'
          cmake-target: 'coverage'
          ccache_max_size: '100G'

      - name: Set artifact name
        if: matrix.job_type == 'build'
        id: set-artifact-name
        run: |
          ARTIFACT_NAME="build-output-nix-${{ github.run_id }}-${{ matrix.compiler }}-${{ matrix.configuration }}"
          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
          echo "Using artifact name: ${ARTIFACT_NAME}"

      - name: Debug build directory
        run: |
          echo "Checking build directory contents: ${{ env.build_dir }}"
          ls -la ${{ env.build_dir }} || echo "Build directory not found or empty"

      - name: Run tests
        if: matrix.job_type == 'build'
        run: |
          # Ensure the binary exists before trying to run
          if [ -f "${{ env.build_dir }}/rippled" ]; then
            ${{ env.build_dir }}/rippled --unittest --unittest-jobs $(nproc)
          else
             echo "Error: rippled executable not found in ${{ env.build_dir }}"
             exit 1
          fi

      # Coverage-specific steps
      - name: Move coverage report
        if: matrix.job_type == 'coverage'
        shell: bash
        env:
          COVERAGE_FILE: ${{ matrix.coverage_tool == 'llvm' && 'coverage.lcov' || 'coverage.xml' }}
        run: |
          mv "${{ env.build_dir }}/${COVERAGE_FILE}" ./
          echo "COVERAGE_FILE=${COVERAGE_FILE}" >> "$GITHUB_ENV"

      - name: Archive coverage report
        if: matrix.job_type == 'coverage'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.COVERAGE_FILE }}-${{ matrix.compiler_id }}
          path: ${{ env.COVERAGE_FILE }}
          retention-days: 30

      - name: Upload coverage report
        if: matrix.job_type == 'coverage' && github.repository == 'Xahau/xahaud'
        uses: codecov/codecov-action@v5
        with:
          files: ${{ env.COVERAGE_FILE }}
          flags: ${{ matrix.coverage_tool }}
          fail_ci_if_error: true
          disable_search: true
          verbose: true
          plugins: noop
          use_oidc: true

      - name: Export server definitions
        if: matrix.job_type == 'build' && matrix.compiler_id == 'gcc-13-libstdcxx'
        run: |
          ${{ env.build_dir }}/rippled --definitions | python3 -m json.tool > server_definitions.json

      - name: Upload server definitions
        if: matrix.job_type == 'build' && matrix.compiler_id == 'gcc-13-libstdcxx'
        uses: actions/upload-artifact@v7
        with:
          name: server-definitions
          path: server_definitions.json
          archive: false
