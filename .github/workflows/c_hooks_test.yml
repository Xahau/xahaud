name: CHooks Test sources

on:
  push:
    branches: ["dev", "candidate", "release"]
  pull_request:
    branches: ["dev", "candidate", "release"]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  chooks-test-sources:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang-format wabt xxd bc

      - name: Export PATH
        run: |
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install wasmcc
        run: |
          curl https://raw.githubusercontent.com/wasienv/wasienv/master/install.sh | sh || true
          wasienv install-sdk unstable
          wasmcc --version

      - name: Install hook-cleaner
        run: |
          # Clone only the latest commit with minimal data transfer
          git clone --depth 1 https://github.com/RichardAH/hook-cleaner-c.git
          cd hook-cleaner-c
          make && sudo make install
          cd ..

      - name: Backup original SetHook_wasm.h
        run: |
          # Creating backup of the existing file
          cp src/test/app/SetHook_wasm.h src/test/app/SetHook_wasm.h.original
          echo "Original file backed up"

      - name: Setup build environment
        run: |
          # Make scripts executable
          chmod +x src/test/app/build_test_hooks.sh

          # Check if necessary test files exist
          if [ ! -f src/test/app/SetHook_test.cpp ]; then
            echo "Error: SetHook_test.cpp not found"
            ls -la src/test/app/
            exit 1
          fi

      - name: Run build_test_hooks.sh
        run: |
          rm -f src/test/app/SetHook_wasm.h
          src/test/app/build_test_hooks.sh
          # Check if output file was created
          if [ ! -f src/test/app/SetHook_wasm.h ]; then
            echo "Error: SetHook_wasm.h was not created"
            exit 1
          fi

      - name: Check for differences
        run: |
          # Format original file for fair comparison
          cp src/test/app/SetHook_wasm.h.original src/test/app/SetHook_wasm.h.original.formatted
          clang-format -i src/test/app/SetHook_wasm.h.original.formatted

          # Compare formatted files
          if diff -u -s src/test/app/SetHook_wasm.h.original.formatted src/test/app/SetHook_wasm.h; then
            echo "✅ SetHook_wasm.h is generated consistently with the original file!"
          else
            echo "❌ SetHook_wasm.h has differences compared to the original file!"
            echo "Differences:"
            diff -u src/test/app/SetHook_wasm.h.original.formatted src/test/app/SetHook_wasm.h
            echo "Run 'src/test/app/build_test_hooks.sh' to generate the SetHook_wasm.h file."
            exit 1
          fi
