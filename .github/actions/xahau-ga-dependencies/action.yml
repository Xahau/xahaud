name: dependencies
description: 'Installs build dependencies with caching'

inputs:
  configuration:
    description: 'Build configuration (Debug, Release, etc.)'
    required: true
  build_dir:
    description: 'Directory to build dependencies in'
    required: false
    default: '.build'
  compiler-id:
    description: 'Unique identifier: compiler-version-stdlib[-gccversion] (e.g. clang-14-libstdcxx-gcc11, gcc-13-libstdcxx)'
    required: false
    default: ''
  cache_version:
    description: 'Cache version for invalidation'
    required: false
    default: '1'
  main_branch:
    description: 'Main branch name for restore keys'
    required: false
    default: 'dev'
  os:
    description: 'Operating system (Linux, Macos)'
    required: false
    default: 'Linux'
  arch:
    description: 'Architecture (x86_64, armv8)'
    required: false
    default: 'x86_64'
  compiler:
    description: 'Compiler type (gcc, clang, apple-clang)'
    required: true
  compiler_version:
    description: 'Compiler version (11, 13, 14, etc.)'
    required: true
  cc:
    description: 'C compiler executable (gcc-13, clang-14, etc.), empty for macOS'
    required: false
    default: ''
  cxx:
    description: 'C++ compiler executable (g++-14, clang++-14, etc.), empty for macOS'
    required: false
    default: ''
  stdlib:
    description: 'C++ standard library for Conan configuration (note: also in compiler-id)'
    required: true
    type: choice
    options:
      - libstdcxx
      - libcxx
  conan_deps_cxxflags:
    description: 'Extra cxxflags applied to Conan dependency package builds only (NOT the rippled build). JSON object keyed by Conan package pattern, e.g. {"grpc/*":["-Wno-foo"]}. Maps to <pattern>:tools.build:cxxflags.'
    required: false
    default: '{}'

outputs:
  cache-hit:
    description: 'Whether there was a cache hit'
    value: ${{ steps.cache-restore-conan.outputs.cache-hit }}

runs:
  using: 'composite'
  steps:
    - name: Configure Conan cache paths
      if: inputs.os == 'Linux'
      shell: bash
      run: |
        mkdir -p /.conan-cache/conan2 /.conan-cache/conan2_download /.conan-cache/conan2_sources
        echo 'core.cache:storage_path=/.conan-cache/conan2' > ~/.conan2/global.conf
        echo 'core.download:download_cache=/.conan-cache/conan2_download' >> ~/.conan2/global.conf
        echo 'core.sources:download_cache=/.conan-cache/conan2_sources' >> ~/.conan2/global.conf

    - name: Configure Conan cache paths
      if: inputs.gha_cache_enabled == 'false'
      shell: bash
      # For self-hosted runners, register cache paths to be used as volumes
      # This allows the cache to be shared between containers
      run: |
        mkdir -p /.conan-cache/conan2 /.conan-cache/conan2_download /.conan-cache/conan2_sources
        echo 'core.cache:storage_path=/.conan-cache/conan2' > ~/.conan2/global.conf
        echo 'core.download:download_cache=/.conan-cache/conan2_download' >> ~/.conan2/global.conf
        echo 'core.sources:download_cache=/.conan-cache/conan2_sources' >> ~/.conan2/global.conf

    - name: Configure Conan
      shell: bash
      env:
        CONAN_DEPS_CXXFLAGS: ${{ inputs.conan_deps_cxxflags }}
      run: |
        # Create the default profile directory if it doesn't exist
        mkdir -p ~/.conan2/profiles

        # Determine the correct libcxx based on stdlib parameter
        if [ "${{ inputs.stdlib }}" = "libcxx" ]; then
          LIBCXX="libc++"
        else
          LIBCXX="libstdc++11"
        fi

        # Create profile with our specific settings
        # This overwrites any cached profile to ensure fresh configuration
        cat > ~/.conan2/profiles/default <<EOF
        [settings]
        arch=${{ inputs.arch }}
        build_type=${{ inputs.configuration }}
        compiler=${{ inputs.compiler }}
        compiler.cppstd=20
        compiler.libcxx=${LIBCXX}
        compiler.version=${{ inputs.compiler_version }}
        os=${{ inputs.os }}
        EOF

        # [buildenv] + [conf] sections.
        # Linux pins compiler executables; macOS uses the system toolchain.
        # conan_deps_cxxflags (matrix-driven) optionally adds package-pattern
        # scoped tools.build:cxxflags for Conan dependency builds only - typically
        # grpc workarounds for newer clang's stricter diagnostics. Because these
        # are profile-pattern scoped (e.g. grpc/*:...), they do NOT affect the
        # consumer/rippled toolchain generated for the main build.
        NEED_CONF=0
        if [ "${{ inputs.os }}" = "Linux" ] && [ -n "${{ inputs.cc }}" ]; then
          cat >> ~/.conan2/profiles/default <<EOF

        [buildenv]
        CC=/usr/bin/${{ inputs.cc }}
        CXX=/usr/bin/${{ inputs.cxx }}

        [conf]
        tools.build:compiler_executables={"c": "/usr/bin/${{ inputs.cc }}", "cpp": "/usr/bin/${{ inputs.cxx }}"}
        EOF
          NEED_CONF=1
        fi

        if [ -n "${CONAN_DEPS_CXXFLAGS}" ] && [ "${CONAN_DEPS_CXXFLAGS}" != "{}" ]; then
          CONAN_DEPS_CXXFLAGS_LINES="$(python3 - <<'PY'
        import json
        import os
        import sys

        raw = os.environ["CONAN_DEPS_CXXFLAGS"]
        data = json.loads(raw)
        if not isinstance(data, dict):
            sys.exit("conan_deps_cxxflags must be a JSON object like {\"grpc/*\": [\"-Wno-...\"]}")

        for pattern, flags in data.items():
            if not isinstance(pattern, str) or not pattern:
                sys.exit("conan_deps_cxxflags keys must be non-empty Conan package patterns")
            if pattern == "&":
                sys.exit("conan_deps_cxxflags must target dependency package patterns, not the consumer (&)")
            if not isinstance(flags, list) or not all(isinstance(flag, str) for flag in flags):
                sys.exit(f"{pattern}: cxxflags must be a JSON string list")
            if flags:
                print(f"{pattern}:tools.build:cxxflags={json.dumps(flags, separators=(',', ':'))}")
        PY
          )"
          if [ -n "${CONAN_DEPS_CXXFLAGS_LINES}" ] && [ "$NEED_CONF" = "0" ]; then
            echo "" >> ~/.conan2/profiles/default
            echo "[conf]" >> ~/.conan2/profiles/default
          fi
          if [ -n "${CONAN_DEPS_CXXFLAGS_LINES}" ]; then
            printf '%s\n' "${CONAN_DEPS_CXXFLAGS_LINES}" >> ~/.conan2/profiles/default
          fi
        fi

        # Display profile for verification
        conan profile show

    - name: Export custom recipes
      shell: bash
      run: |
        # Export snappy if not already exported
        conan list snappy/1.1.10@xahaud/stable 2>/dev/null | (grep -q "not found" && exit 1 || exit 0) || \
          conan export external/snappy --version 1.1.10 --user xahaud --channel stable
        
        # Export soci if not already exported
        conan list soci/4.0.3@xahaud/stable 2>/dev/null | (grep -q "not found" && exit 1 || exit 0) || \
          conan export external/soci --version 4.0.3 --user xahaud --channel stable
        
        # Export wasmedge if not already exported
        conan list wasmedge/0.11.2@xahaud/stable 2>/dev/null | (grep -q "not found" && exit 1 || exit 0) || \
          conan export external/wasmedge --version 0.11.2 --user xahaud --channel stable
    - name: Install dependencies
      shell: bash
      env:
        CONAN_REQUEST_TIMEOUT: 180  # Increase timeout to 3 minutes for slow mirrors
      run: |
        # Create build directory
        mkdir -p ${{ inputs.build_dir }}
        cd ${{ inputs.build_dir }}
        
        # Install dependencies using conan
        conan install \
          --output-folder . \
          --build missing \
          --settings build_type=${{ inputs.configuration }} \
          ..
