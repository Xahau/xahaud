name: dependencies
description: 'Installs build dependencies with caching'

inputs:
  configuration:
    description: 'Build configuration (Debug, Release, etc.)'
    required: true
  build_dir:
    description: 'Directory to build dependencies in'
    required: false
    default: '.build'
  compiler-id:
    description: 'Unique identifier: compiler-version-stdlib[-gccversion] (e.g. clang-14-libstdcxx-gcc11, gcc-13-libstdcxx)'
    required: false
    default: ''
  cache_version:
    description: 'Cache version for invalidation'
    required: false
    default: '1'
  cache_enabled:
    description: 'Whether to use caching'
    required: false
    default: 'true'
  main_branch:
    description: 'Main branch name for restore keys'
    required: false
    default: 'dev'
  stdlib:
    description: 'C++ standard library for Conan configuration (note: also in compiler-id)'
    required: true
    type: choice
    options:
      - libstdcxx
      - libcxx

outputs:
  cache-hit:
    description: 'Whether there was a cache hit'
    value: ${{ steps.cache-restore-conan.outputs.cache-hit }}

runs:
  using: 'composite'
  steps:
    - name: Generate safe branch name
      if: inputs.cache_enabled == 'true'
      id: safe-branch
      shell: bash
      run: |
        SAFE_BRANCH=$(echo "${{ github.ref_name }}" | tr -c 'a-zA-Z0-9_.-' '-')
        echo "name=${SAFE_BRANCH}" >> $GITHUB_OUTPUT

    - name: Restore Conan cache
      if: inputs.cache_enabled == 'true'
      id: cache-restore-conan
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.conan
          ~/.conan2
        # Note: compiler-id format is compiler-version-stdlib[-gccversion]
        key: ${{ runner.os }}-conan-v${{ inputs.cache_version }}-${{ inputs.compiler-id }}-${{ hashFiles('**/conanfile.txt', '**/conanfile.py') }}-${{ inputs.configuration }}
        restore-keys: |
          ${{ runner.os }}-conan-v${{ inputs.cache_version }}-${{ inputs.compiler-id }}-${{ hashFiles('**/conanfile.txt', '**/conanfile.py') }}-
          ${{ runner.os }}-conan-v${{ inputs.cache_version }}-${{ inputs.compiler-id }}-

    - name: Export custom recipes
      shell: bash
      run: |
        conan export external/snappy snappy/1.1.10@xahaud/stable
        conan export external/soci soci/4.0.3@xahaud/stable

    - name: Add Clang version support to Conan if needed
      if: contains(inputs.compiler-id, 'clang-')
      shell: python
      run: |
        import yaml
        import re
        from pathlib import Path
        import subprocess
        
        # Extract Clang version from compiler-id (e.g., "clang-18-libcxx" -> "18")
        compiler_id = "${{ inputs.compiler-id }}"
        match = re.match(r'^clang-(\d+)', compiler_id)
        
        if not match:
            print(f"No Clang version found in compiler-id: {compiler_id}")
            exit(0)
            
        clang_version = match.group(1)
        print(f"Detected Clang version {clang_version} from compiler-id")
        
        settings_path = Path.home() / '.conan' / 'settings.yml'
        
        # Initialize Conan if settings.yml doesn't exist yet
        if not settings_path.exists():
            print("Conan not initialized, creating default profile...")
            subprocess.run(['conan', 'profile', 'new', 'default', '--detect'], check=False)
        
        with open(settings_path, 'r') as f:
            settings = yaml.safe_load(f)
        
        # Add the detected version to clang versions if not already there
        clang_versions = settings['compiler']['clang']['version']
        if clang_version not in clang_versions:
            clang_versions.append(clang_version)
            # Sort versions numerically
            clang_versions.sort(key=lambda x: int(x) if x.isdigit() else float('inf'))
            
            with open(settings_path, 'w') as f:
                yaml.dump(settings, f, default_flow_style=False, sort_keys=False)
            print(f"Added Clang {clang_version} support to Conan settings")
        else:
            print(f"Clang {clang_version} already supported in Conan settings")

    - name: Install dependencies
      shell: bash
      run: |
        # Create build directory
        mkdir -p ${{ inputs.build_dir }}
        cd ${{ inputs.build_dir }}
        
        # Install dependencies using conan
        conan install \
          --output-folder . \
          --build missing \
          --settings build_type=${{ inputs.configuration }} \
          ..

    - name: Save Conan cache
      if: inputs.cache_enabled == 'true' && steps.cache-restore-conan.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          ~/.conan
          ~/.conan2
        key: ${{ steps.cache-restore-conan.outputs.cache-primary-key }}
