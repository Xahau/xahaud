name: patch-conan-post-setup
description: 'Apply post-setup patches to Conan configuration (e.g., add support for newer compiler versions)'

inputs:
  compiler-id:
    description: 'Unique identifier: compiler-version-stdlib[-gccversion] (e.g. clang-18-libcxx)'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Add Clang version support to Conan if needed
      if: contains(inputs.compiler-id, 'clang-')
      shell: python
      run: |
        import yaml
        import re
        import subprocess
        from pathlib import Path
        
        # Extract Clang version from compiler-id (e.g., "clang-18-libcxx" -> "18")
        compiler_id = "${{ inputs.compiler-id }}"
        match = re.match(r'^clang-(\d+)', compiler_id)
        
        if not match:
            print(f"No Clang version found in compiler-id: {compiler_id}")
            exit(0)
            
        clang_version = match.group(1)
        print(f"Detected Clang version {clang_version} from compiler-id")
        
        # Get Conan home directory
        result = subprocess.run(['conan', 'config', 'home'], capture_output=True, text=True)
        conan_home = Path(result.stdout.strip())
        settings_path = conan_home / 'settings.yml'
        print(f"Conan home: {conan_home}")
        print(f"Settings path: {settings_path}")
        
        # Check if settings.yml exists
        # Note: Conan 1 uses embedded defaults until 'conan config init' is called
        # The settings.yml file is only created on disk when explicitly requested
        if not settings_path.exists():
            print(f"Settings.yml not found at {settings_path}")
            print("Running 'conan config init' to create default config files...")
            # This creates settings.yml from Conan's internal templates
            # Safe to run - won't overwrite existing files without --force
            subprocess.run(['conan', 'config', 'init'], check=False)
            
            if not settings_path.exists():
                print(f"ERROR: Failed to create settings.yml at {settings_path}")
                exit(1)
            print("Created default settings.yml")
        
        with open(settings_path, 'r') as f:
            settings = yaml.safe_load(f)
        
        # Add the detected version to clang versions if not already there
        clang_versions = settings['compiler']['clang']['version']
        if clang_version not in clang_versions:
            clang_versions.append(clang_version)
            # Sort versions numerically
            clang_versions.sort(key=lambda x: int(x) if x.isdigit() else float('inf'))
            
            with open(settings_path, 'w') as f:
                yaml.dump(settings, f, default_flow_style=False, sort_keys=False)
            print(f"Added Clang {clang_version} support to Conan settings")
        else:
            print(f"Clang {clang_version} already supported in Conan settings")