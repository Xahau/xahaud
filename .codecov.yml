codecov:
  require_ci_to_pass: true

comment:
  behavior: default
  layout: reach,diff,flags,tree,reach
  show_carryforward_flags: false

coverage:
  range: "60..80"
  precision: 1
  round: nearest
  status:
    project:
      default:
        target: 60%
        threshold: 2%
    patch:
      default:
        target: auto
        threshold: 2%
        paths:
          # PeerImp is historically hard to exercise in the current unit-test
          # harness. Keep this list narrow; new testable code should remain
          # covered by the default patch gate.
          - "!src/xrpld/overlay/detail/PeerImp.cpp"
          # ExportRelay is a live TLS peer-protocol client, null under
          # standalone (so under jtx::Env) and anonymous-namespace: the same
          # situation as PeerImp. See Export.h for what it does.
          - "!src/xrpld/app/misc/ExportRelay.cpp"
      historically-untested:
        target: 0%
        paths:
          - "src/xrpld/overlay/detail/PeerImp.cpp"
          - "src/xrpld/app/misc/ExportRelay.cpp"
    changes: false

github_checks:
  annotations: true

parsers:
  cobertura:
    partials_as_hits: true
    handle_missing_conditions : true

slack_app: false

ignore:
  - "src/test/"
  - "include/xrpl/beast/test/"
  - "include/xrpl/beast/unit_test/"
